name: Build native installers

on:
  workflow_dispatch:
    inputs:
      installer_version:
        description: "Versione dell'installer da pubblicare"
        required: false
        default: "0.4.3"
  push:
    tags: ["v*.*.*"]

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            artifact: Interpresona-linux
            platform_name: linux-x86_64
          - os: windows-latest
            artifact: Interpresona-windows
            platform_name: windows-x86_64
          - os: macos-latest
            artifact: Interpresona-macos
            platform_name: macos-arm64
            python_architecture: arm64
          - os: macos-latest
            artifact: Interpresona-macos-intel
            platform_name: macos-x86_64
            python_architecture: x64
    runs-on: ${{ matrix.os }}
    env:
      PORTAL_API_KEY: ${{ secrets.FFXIV_PORTAL_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: ${{ matrix.python_architecture || 'x64' }}
      - name: Install build requirements
        run: python -m pip install -r packaging/requirements-build.txt
      - name: Build executable
        run: python scripts/build_native.py --package dist/Interpresona-${{ matrix.artifact }}.zip
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/Interpresona-${{ matrix.artifact }}.zip
      - name: Publish native package to portal
        if: ${{ env.PORTAL_API_KEY != '' }}
        shell: bash
        run: |
          release_version="${{ inputs.installer_version }}"
          if [ -z "$release_version" ]; then release_version="${GITHUB_REF_NAME#v}"; fi
          curl --fail --silent --show-error \
            -H "X-API-Key: ${PORTAL_API_KEY}" \
            -F "platform_name=${{ matrix.platform_name }}" \
            -F "version=${release_version}" \
            -F "installer=@dist/Interpresona-${{ matrix.artifact }}.zip;filename=Interpresona-${{ matrix.platform_name }}.zip" \
            https://ffxiv.paolozzi.me/api/v1/admin/installer
