#!/usr/sbin/nft -f

flush ruleset

table inet filter {
    chain input {
        type filter hook input priority filter;
        policy accept;

        iifname "lo" accept
        ct state established,related accept

        # Uvicorn is reachable only from the internal HTTPS reverse proxy.
        ip saddr 192.168.1.114 tcp dport 8000 accept
        tcp dport 8000 drop
    }

    chain forward {
        type filter hook forward priority filter;
        policy accept;
    }

    chain output {
        type filter hook output priority filter;
        policy accept;
    }
}
